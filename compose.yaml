services:
  vpndogs-router:
    image: nimaboubanian/sing-box-router
    container_name: vpndogs-router
    ports:
      - "127.0.0.1:1070:1070"
    environment:
      PROXY_HOST: vpndogs-selector
      PROXY_PORT: "1080"
    volumes:
      - sb-router-cache:/var/lib/sing-box
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1070'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      vpndogs-selector:
        condition: service_healthy
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-selector:
    image: haproxy:lts-alpine
    container_name: vpndogs-selector
    volumes:
      - ./configs/selector/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      vpndogs-sb-clients-lb:
        condition: service_healthy
      vpndogs-softether:
        condition: service_started
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-sb-clients-lb:
    image: nimaboubanian/sing-box-lb
    container_name: vpndogs-sb-clients-lb
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1081"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      sb-client-1:
        condition: service_healthy
      sb-client-2:
        condition: service_healthy
        required: false
      sb-client-3:
        condition: service_healthy
        required: false
      sb-client-4:
        condition: service_healthy
        required: false
    networks: [vpndogs]
    restart: unless-stopped

  sb-client-1:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-1
    environment:
      SUB_URL: ${SUB_URL_1:?SUB_URL_1 is required}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb1]
    restart: unless-stopped

  sb-client-2:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-2
    profiles: ["sb-client-2"]
    environment:
      SUB_URL: ${SUB_URL_2:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb2]
    restart: unless-stopped

  sb-client-3:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-3
    profiles: ["sb-client-3"]
    environment:
      SUB_URL: ${SUB_URL_3:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb3]
    restart: unless-stopped

  sb-client-4:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-4
    profiles: ["sb-client-4"]
    environment:
      SUB_URL: ${SUB_URL_4:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb4]
    restart: unless-stopped

  vpndogs-softether:
    image: nimaboubanian/softether-vpn-client
    container_name: vpndogs-softether
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    expose:
      - "1082"
    environment:
      SE_HOST: ${SE_HOST:-}
      SE_PORT: ${SE_PORT:-443}
      SE_HUB: ${SE_HUB:-}
      SE_USER: ${SE_USER:-}
      SE_PASSWORD: ${SE_PASSWORD:-}
      VPN_PROFILE: ${VPN_PROFILE:-}
    volumes:
      - vpnconfig:/vpnclient
      - ./vpn-profiles:/vpn-profiles:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1082'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [vpndogs]
    restart: unless-stopped

volumes:
  sb-router-cache:
  vpnconfig:

networks:
  vpndogs:
    name: vpndogs
