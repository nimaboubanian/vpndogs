services:
  vpndogs-router:
    image: nimaboubanian/sing-box-router
    container_name: vpndogs-router
    ports:
      - "127.0.0.1:1070:1070"
    environment:
      PROXY_HOST: vpndogs-selector
      PROXY_PORT: "1080"
    volumes:
      - sb-router-cache:/var/lib/sing-box
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1070'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      vpndogs-selector:
        condition: service_healthy
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-selector:
    image: haproxy:lts-alpine
    container_name: vpndogs-selector
    volumes:
      - ./configs/selector/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      vpndogs-sb-clients-lb:
        condition: service_healthy
      vpndogs-softether:
        condition: service_started
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-sb-clients-lb:
    image: nimaboubanian/sing-box-lb
    container_name: vpndogs-sb-clients-lb
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1081"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      sb-client-1:
        condition: service_healthy
      sb-client-2:
        condition: service_healthy
        required: false
      sb-client-3:
        condition: service_healthy
        required: false
      sb-client-4:
        condition: service_healthy
        required: false
    networks: [vpndogs]
    restart: unless-stopped

  sb-client-1:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-1
    environment:
      SUB_URL: ${SUB_URL_1:?SUB_URL_1 is required}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb1]
    restart: unless-stopped

  sb-client-2:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-2
    profiles: ["sb-client-2"]
    environment:
      SUB_URL: ${SUB_URL_2:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb2]
    restart: unless-stopped

  sb-client-3:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-3
    profiles: ["sb-client-3"]
    environment:
      SUB_URL: ${SUB_URL_3:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb3]
    restart: unless-stopped

  sb-client-4:
    image: nimaboubanian/sing-box-client
    container_name: vpndogs-sb-client-4
    profiles: ["sb-client-4"]
    environment:
      SUB_URL: ${SUB_URL_4:-}
      FINAL_TAG: "💦 🔗 Best Ping 🚀"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1081'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      vpndogs:
        aliases: [sb4]
    restart: unless-stopped

  vpndogs-softether:
    image: nimaboubanian/softether-vpn-client
    container_name: vpndogs-softether
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    expose:
      - "1082"
    environment:
      SE_HOST: ${SE_HOST:-}
      SE_PORT: ${SE_PORT:-443}
      SE_HUB: ${SE_HUB:-}
      SE_USER: ${SE_USER:-}
      SE_PASSWORD: ${SE_PASSWORD:-}
      VPN_PROFILE: ${VPN_PROFILE:-}
    volumes:
      - vpnconfig:/vpnclient
      - ./vpn-profiles:/vpn-profiles:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1082'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-ipsec-inbound:
    image: nimaboubanian/strongswan-server
    container_name: vpndogs-ipsec-inbound
    profiles: ["ipsec-inbound"]
    ports:
      # 500/4500 are what native IKEv2 clients and legacy IKEv1 routers can
      # reach; 1061 is the extra port strongSwan-based clients can target
      # (it lands on charon's stock NAT-T socket).
      - "500:500/udp"
      - "4500:4500/udp"
      - "1061:4500/udp"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    sysctls:
      # forwarding is required: XFRM decapsulates into the container netns and
      # the policy route hands the packet to tun0
      net.ipv4.ip_forward: "1"
      # rp_filter drops XFRM-decapped packets: their source (the VPN pool) has
      # no reverse path in the main table
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    environment:
      # `:-` and never `:?`: a `:?` breaks `docker compose` for profile-inactive
      # services. The entrypoint enforces required-ness (fatal + restart loop)
      # only when the profile is actually enabled.
      IPSEC_USERS: ${IPSEC_USERS:-}
      IPSEC_PSK: ${IPSEC_PSK:-}
      VPN_SERVER_ADDR: ${VPN_SERVER_ADDR:-}
      VPN_POOL: ${VPN_POOL:-10.10.10.0/24}
      CLIENT_DNS: ${CLIENT_DNS:-1.1.1.1}
      CHAIN_SOCKS_HOST: ${CHAIN_SOCKS_HOST:-vpndogs-router}
      CHAIN_SOCKS_PORT: ${CHAIN_SOCKS_PORT:-1070}
      LOG_LEVEL: ${LOG_LEVEL:-1}
    volumes:
      - ipsec-certs:/etc/swanctl
    healthcheck:
      test: ["CMD", "swanctl", "--stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      vpndogs-router:
        condition: service_healthy
    networks: [vpndogs]
    restart: unless-stopped

  vpndogs-wg-inbound:
    image: nimaboubanian/wireguard-server
    container_name: vpndogs-wg-inbound
    profiles: ["wg-inbound"]
    ports:
      - "1062:1062/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      # forwarding is required: WireGuard decapsulates into the container netns
      # and the policy route hands the packet to tun0
      net.ipv4.ip_forward: "1"
      # rp_filter drops WG-decapped packets: their source (the VPN pool) has no
      # reverse path in the main table
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    environment:
      # `:-` and never `:?`: a `:?` breaks `docker compose` for profile-inactive
      # services. The entrypoint enforces required-ness (fatal + restart loop)
      # only when the profile is actually enabled.
      WG_PEERS: ${WG_PEERS:-}
      WG_POOL: ${WG_POOL:-10.10.20.0/24}
      CHAIN_SOCKS_HOST: ${CHAIN_SOCKS_HOST:-vpndogs-router}
      CHAIN_SOCKS_PORT: ${CHAIN_SOCKS_PORT:-1070}
    volumes:
      - wg-keys:/etc/wireguard
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      vpndogs-router:
        condition: service_healthy
    networks: [vpndogs]
    restart: unless-stopped

volumes:
  sb-router-cache:
  vpnconfig:
  ipsec-certs:
  wg-keys:

networks:
  vpndogs:
