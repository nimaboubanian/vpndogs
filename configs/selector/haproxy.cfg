global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option redispatch
    retries 3
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout check   3s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend socks_in
    bind :1080
    default_backend egress

backend egress
    option tcp-check
    tcp-check connect
    tcp-check send-binary 050100
    tcp-check expect binary 0500
    tcp-check send-binary 050100010101010101bb
    tcp-check expect binary 0500
    default-server inter 2s fall 3 rise 2 resolvers docker init-addr last,libc,none
    server sb-cluster vpndogs-sb-clients-lb:1081 check
    server softether-fallback vpndogs-softether:1082 check backup
